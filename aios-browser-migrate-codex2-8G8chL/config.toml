model = "gpt"

[mcp_servers.mcp-browser-use]
type = "stdio"
command = "node"
args = ["aios-browser-migrate-pw-b4zEXr/scripts/run-local-browser-mcp.mjs"]
startup_timeout_sec = 60

[mcp_servers.mcp-browser-use.env]
BROWSER_USE_CDP_URL = "http://127.0.0.1:9222"

[mcp_servers.aios-auth-tools]
type = "stdio"
command = "python3"
args = ["-u", "aios-browser-migrate-pw-b4zEXr/scripts/auth-tools-server.py"]
startup_timeout_sec = 30

[mcp_servers.aios-auth-tools.env]
BROWSER_USE_CDP_URL = "http://127.0.0.1:9222"

[mcp_servers.aios-shell]
type = "stdio"
command = "/Users/rex/.nvm/versions/node/v24.16.0/bin/node"
args = ["aios-browser-migrate-pw-b4zEXr/scripts/aios-mcp-proxy.mjs", "--workspace", "aios-browser-migrate-pw-b4zEXr", "--host", "aios-shell", "--", "/Users/rex/.nvm/versions/node/v24.16.0/bin/node", "aios-browser-migrate-pw-b4zEXr/scripts/shell-mcp-server.mjs"]
startup_timeout_sec = 30

[mcp_servers.aios-shell.env]
AIOS_INTERCEPTION_METRICS = "1"
AIOS_MCP_PROXY = "1"
AIOS_MCP_UPSTREAM_HOST = "aios-shell"
