model = "gpt"

[mcp_servers.aios-auth-tools]
type = "stdio"
command = "python3"
args = ["-u", "aios-browser-migrate-none-fF2qzO/scripts/auth-tools-server.py"]
startup_timeout_sec = 30

[mcp_servers.aios-auth-tools.env]
BROWSER_USE_CDP_URL = "http://127.0.0.1:9333"

[mcp_servers.aios-shell]
type = "stdio"
command = "/Users/rex/.nvm/versions/node/v24.16.0/bin/node"
args = ["aios-browser-migrate-none-fF2qzO/scripts/aios-mcp-proxy.mjs", "--workspace", "aios-browser-migrate-none-fF2qzO", "--host", "aios-shell", "--", "/Users/rex/.nvm/versions/node/v24.16.0/bin/node", "aios-browser-migrate-none-fF2qzO/scripts/shell-mcp-server.mjs"]
startup_timeout_sec = 30

[mcp_servers.aios-shell.env]
AIOS_INTERCEPTION_METRICS = "1"
AIOS_MCP_PROXY = "1"
AIOS_MCP_UPSTREAM_HOST = "aios-shell"
